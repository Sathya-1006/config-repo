server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**,/api/customers/**,/api/addresses/**,/api/organizations/**

spring.cloud.gateway.routes[2].id=vehicle-service
spring.cloud.gateway.routes[2].uri=lb://vehicle-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/vehicles/**

spring.cloud.gateway.routes[3].id=catalog-service
spring.cloud.gateway.routes[3].uri=lb://catalog-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/catalog/**,/api/services/**

spring.cloud.gateway.routes[4].id=booking-service
spring.cloud.gateway.routes[4].uri=lb://booking-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[5].id=assignment-service
spring.cloud.gateway.routes[5].uri=lb://assignment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/assignments/**

spring.cloud.gateway.routes[6].id=washer-service
spring.cloud.gateway.routes[6].uri=lb://washer-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/washers/**

spring.cloud.gateway.routes[7].id=payment-service
spring.cloud.gateway.routes[7].uri=lb://payment-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[8].id=invoice-service
spring.cloud.gateway.routes[8].uri=lb://invoice-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/invoices/**

spring.cloud.gateway.routes[9].id=loyalty-service
spring.cloud.gateway.routes[9].uri=lb://loyalty-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/loyalty/**

spring.cloud.gateway.routes[10].id=notification-service
spring.cloud.gateway.routes[10].uri=lb://notification-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[11].id=review-service
spring.cloud.gateway.routes[11].uri=lb://review-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.routes[12].id=support-service
spring.cloud.gateway.routes[12].uri=lb://support-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/support/**

spring.cloud.gateway.routes[13].id=reporting-service
spring.cloud.gateway.routes[13].uri=lb://reporting-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/reports/**

management.endpoints.web.exposure.include=health,info,metrics
