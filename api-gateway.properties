spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=orderServiceCircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/order

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.name=notificationServiceCircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.fallbackUri=forward:/fallback/notification

spring.cloud.gateway.routes[5].id=wallet-service
spring.cloud.gateway.routes[5].uri=lb://wallet-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/wallets/**
spring.cloud.gateway.routes[5].filters[0].name=CircuitBreaker
