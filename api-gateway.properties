spring.cloud.gateway.routes[5].filters[0].args.fallbackUri=forward:/fallback/wallet

resilience4j.circuitbreaker.instances.profileServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.profileServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.profileServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.profileServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.waitDurationInOpenState=10s
